name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valeurs FACTICES : la CI ne doit jamais disposer de vrais secrets.
  APP_ENV: staging
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/tout_en_un_test
  SESSION_SECRET: dGVzdC1zZXNzaW9uLXNlY3JldC0zMi1vY3RldHMtZmFrZQ==
  APP_ENC_KEYS: 1:Q0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0M=
  APP_ENC_ACTIVE: '1'

jobs:
  quality:
    name: Lint · types · tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Continuité et cohérence documentaire
        run: node scripts/project-memory.mjs check

      - name: Lint
        run: npm run lint

      - name: Vérification TypeScript
        run: npm run typecheck

      - name: Tests unitaires et d'intégration
        run: npm test

      # Décision du 2026-11-17 : la CI bloque sur les vulnérabilités high/critical
      # des dépendances de PRODUCTION uniquement. Justification complète dans
      # docs/securite/audit-dependances.md ; dépendances de développement auditées
      # ci-dessous sans blocage, avec rapport visible dans le journal.
      - name: Audit des dépendances de production (BLOQUANT high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit des dépendances de développement (informatif, non bloquant)
        run: npm audit --audit-level=high || true

      - name: Build
        run: npm run build

  migrations:
    name: Migrations (PostgreSQL 16 réel)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tout_en_un_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Appliquer les migrations
        run: npm run db:migrate
      - name: Vérifier les extensions attendues
        run: |
          psql "$DATABASE_URL" -Atc "SELECT extname FROM pg_extension WHERE extname IN ('pg_trgm','unaccent') ORDER BY extname" | grep -qx 'pg_trgm' || exit 1
          psql "$DATABASE_URL" -Atc "SELECT extname FROM pg_extension WHERE extname IN ('pg_trgm','unaccent') ORDER BY extname" | grep -qx 'unaccent' || exit 1
      - name: Rollback puis réapplication (réversibilité)
        run: |
          # Nombre dérivé du suivi en base, pas d’une liste figée lors de l’ajout d’une migration.
          count=$(psql "$DATABASE_URL" -Atc 'SELECT count(*) FROM schema_migrations')
          test "$count" -gt 0
          for ((i=0; i<count; i++)); do npm run db:rollback || exit 1; done
          psql "$DATABASE_URL" -Atc 'SELECT count(*) FROM schema_migrations' | grep -qx '0'
          npm run db:migrate
      - name: Sauvegarder et restaurer dans une seconde base PostgreSQL CI
        run: node scripts/test-backup-restore.mjs
      - name: Contrôle final
        run: psql "$DATABASE_URL" -c "\dt" && psql "$DATABASE_URL" -c "SELECT count(*) AS migrations FROM schema_migrations;"

      - name: Concurrence de la délégation sous rôle sans BYPASSRLS
        env:
          DATABASE_URL_ADMIN: postgres://postgres:postgres@localhost:5432/tout_en_un_test
        run: |
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -v app_password='ci-app-password' -f scripts/db-roles.sql
          DATABASE_URL=postgres://toutenun_app:ci-app-password@localhost:5432/tout_en_un_test npx tsx scripts/test-delegation-postgres.ts

      # Deux renouvellements simultanés du même jeton Jumia ne doivent produire qu'UN appel API :
      # chaque `POST /token` invalide le refresh token utilisé, donc deux appels déconnectent la
      # boutique. Ce test exige plusieurs connexions réelles, donc PostgreSQL et pas PGlite.
      - name: Un seul renouvellement de jeton Jumia sous concurrence
        env:
          DATABASE_URL_ADMIN: postgres://postgres:postgres@localhost:5432/tout_en_un_test
        run: |
          psql "$DATABASE_URL_ADMIN" -v ON_ERROR_STOP=1 -v app_password='ci-app-password' -f scripts/db-roles.sql
          CI=true APP_ENV=staging \
          DATABASE_URL_ADMIN=postgres://postgres:postgres@localhost:5432/tout_en_un_test \
          DATABASE_URL=postgres://toutenun_app:ci-app-password@localhost:5432/tout_en_un_test \
          npx tsx scripts/test-jumia-token-race.ts

  e2e:
    name: Navigateur bureau et mobile 375 px
    runs-on: ubuntu-latest
    needs: [quality, migrations]
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tout_en_un_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Préparer la base et le rôle applicatif sans BYPASSRLS
        run: |
          npm run db:migrate
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v app_password='ci-app-password' -f scripts/db-roles.sql
          psql "$DATABASE_URL" -Atc "SELECT rolbypassrls FROM pg_roles WHERE rolname = 'toutenun_app'" | grep -qx 'f'
      - name: Vérifier la RLS avec le véritable rôle applicatif
        env:
          DATABASE_URL_ADMIN: postgres://postgres:postgres@localhost:5432/tout_en_un_test
        run: node scripts/test-rls.mjs
      - name: Créer un propriétaire CI fictif avec TOTP et codes de secours
        env:
          DATABASE_URL_ADMIN: postgres://postgres:postgres@localhost:5432/tout_en_un_test
          OWNER_EMAIL: proprietaire@ci.invalid
          OWNER_NAME: Propriétaire CI
          OWNER_PASSWORD_FILE: /tmp/ci-owner-password
          TOTP_QR_FILE: /tmp/ci-owner-qr.png
          TOTP_RECOVERY_FILE: /tmp/ci-recovery-codes
        run: |
          printf 'MotDePasseCI!2026\n' > /tmp/ci-owner-password
          chmod 600 /tmp/ci-owner-password
          npm run auth:bootstrap
          node scripts/extend-e2e-recovery.mjs
          rm -f /tmp/ci-owner-password /tmp/ci-owner-qr.png
      - name: Préparer une boutique et un événement d’audit fictifs pour le navigateur
        env:
          DATABASE_URL_ADMIN: postgres://postgres:postgres@localhost:5432/tout_en_un_test
        run: node scripts/seed-e2e-shop.mjs
      - name: Installer Chromium et dépendances système
        run: npx playwright install --with-deps chromium
      - name: Parcours publics et authentifiés sur PostgreSQL 16
        env:
          DATABASE_URL: postgres://toutenun_app:ci-app-password@localhost:5432/tout_en_un_test
          E2E_RECOVERY_FILE: /tmp/ci-recovery-codes
          # La mesure de latence n'écrit que si elle est armée : sans cette variable, l'écran
          # Système n'aurait aucun échantillon et le parcours devrait tolérer une latence vide.
          LATENCY_INSTRUMENTATION: 'on'
        run: npm run test:e2e
      - name: Préparer les membres fictifs pour la délégation
        env:
          DATABASE_URL_ADMIN: postgres://postgres:postgres@localhost:5432/tout_en_un_test
          E2E_DELEGATION_FILE: /tmp/ci-delegation-fixtures
        run: node scripts/seed-e2e-delegation.mjs
      - name: Délégation et journal global sur navigateur bureau et mobile
        env:
          DATABASE_URL: postgres://toutenun_app:ci-app-password@localhost:5432/tout_en_un_test
          E2E_DELEGATION_FILE: /tmp/ci-delegation-fixtures
        run: npx playwright test tests/e2e/delegation.spec.ts tests/e2e/global-audit.spec.ts --workers=1
      - name: Nettoyer les fixtures temporaires
        if: always()
        run: rm -f /tmp/ci-delegation-fixtures
      - name: Nettoyer les codes de secours CI
        if: always()
        run: rm -f /tmp/ci-owner-password /tmp/ci-owner-qr.png /tmp/ci-recovery-codes
      - name: Traces en cas d’échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7

  code_archive:
    name: Archive du code validé (30 jours)
    # Jamais sur une PR ou après un échec : seule la branche main validée est archivée.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, migrations, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Vérifier la mémoire et créer le bundle Git et l'archive source
        run: |
          node scripts/project-memory.mjs check
          node scripts/project-memory.mjs snapshot ci-main
          cd .project-backups
          sha256sum -c ./*.sha256
          for bundle in ./*.bundle; do git -C .. bundle verify ".project-backups/${bundle#./}"; done
          cd ..
          # upload-artifact@v4 ignore les dossiers cachés par défaut : ne copier que
          # les trois fichiers contrôlés vers un dossier visible et temporaire.
          mkdir -p code-archive-upload
          cp .project-backups/*.bundle .project-backups/*.zip .project-backups/*.sha256 code-archive-upload/
          test "$(find code-archive-upload -maxdepth 1 -type f | wc -l)" -eq 3
      - name: Conserver l'archive vérifiée (stockage GitHub temporaire)
        uses: actions/upload-artifact@v4
        with:
          name: code-valide-${{ github.sha }}
          path: code-archive-upload/
          if-no-files-found: error
          retention-days: 30
