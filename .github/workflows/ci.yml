name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valeurs FACTICES : la CI ne doit jamais disposer de vrais secrets.
  APP_ENV: staging
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/tout_en_un_test
  SESSION_SECRET: dGVzdC1zZXNzaW9uLXNlY3JldC0zMi1vY3RldHMtZmFrZQ==
  APP_ENC_KEYS: 1:Q0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0M=
  APP_ENC_ACTIVE: '1'

jobs:
  quality:
    name: Lint · types · tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Vérification TypeScript
        run: npm run typecheck

      - name: Tests unitaires et d'intégration
        run: npm test

      - name: Audit des dépendances (bloquant sur high/critical)
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

  migrations:
    name: Migrations (PostgreSQL 16 réel)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tout_en_un_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Appliquer les migrations
        run: npm run db:migrate
      - name: Vérifier les extensions attendues
        run: |
          psql "$DATABASE_URL" -Atc "SELECT extname FROM pg_extension WHERE extname IN ('pg_trgm','unaccent') ORDER BY extname" | grep -qx 'pg_trgm' || exit 1
          psql "$DATABASE_URL" -Atc "SELECT extname FROM pg_extension WHERE extname IN ('pg_trgm','unaccent') ORDER BY extname" | grep -qx 'unaccent' || exit 1
      - name: Rollback puis réapplication (réversibilité)
        run: |
          for i in 1 2 3 4 5 6 7; do npm run db:rollback || exit 1; done
          psql "$DATABASE_URL" -Atc 'SELECT count(*) FROM schema_migrations' | grep -qx '0'
          npm run db:migrate
      - name: Contrôle final
        run: psql "$DATABASE_URL" -c "\dt" && psql "$DATABASE_URL" -c "SELECT count(*) AS migrations FROM schema_migrations;"

  e2e:
    name: Navigateur bureau et mobile 375 px
    runs-on: ubuntu-latest
    needs: [quality, migrations]
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tout_en_un_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Préparer la base et le rôle applicatif sans BYPASSRLS
        run: |
          npm run db:migrate
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v app_password='ci-app-password' -f scripts/db-roles.sql
          psql "$DATABASE_URL" -Atc "SELECT rolbypassrls FROM pg_roles WHERE rolname = 'toutenun_app'" | grep -qx 'f'
      - name: Vérifier la RLS avec le véritable rôle applicatif
        env:
          DATABASE_URL_ADMIN: postgres://postgres:postgres@localhost:5432/tout_en_un_test
        run: node scripts/test-rls.mjs
      - name: Créer un propriétaire CI fictif avec TOTP et codes de secours
        env:
          DATABASE_URL_ADMIN: postgres://postgres:postgres@localhost:5432/tout_en_un_test
          OWNER_EMAIL: proprietaire@ci.invalid
          OWNER_NAME: Propriétaire CI
          OWNER_PASSWORD_FILE: /tmp/ci-owner-password
          TOTP_QR_FILE: /tmp/ci-owner-qr.png
          TOTP_RECOVERY_FILE: /tmp/ci-recovery-codes
        run: |
          printf 'MotDePasseCI!2026\n' > /tmp/ci-owner-password
          chmod 600 /tmp/ci-owner-password
          npm run auth:bootstrap
          rm -f /tmp/ci-owner-password /tmp/ci-owner-qr.png
      - name: Installer Chromium et dépendances système
        run: npx playwright install --with-deps chromium
      - name: Parcours publics et authentifiés sur PostgreSQL 16
        env:
          DATABASE_URL: postgres://toutenun_app:ci-app-password@localhost:5432/tout_en_un_test
          E2E_RECOVERY_FILE: /tmp/ci-recovery-codes
        run: npm run test:e2e
      - name: Nettoyer les codes de secours CI
        if: always()
        run: rm -f /tmp/ci-owner-password /tmp/ci-owner-qr.png /tmp/ci-recovery-codes
      - name: Traces en cas d’échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7
