# Modèle de déploiement, non testé sur un VPS : lire docs/deploiement.md AVANT usage.
# Chaque environnement (staging/prod) nécessite son propre projet Compose, ses propres
# volumes, sa base, ses clés, son nom de domaine et son fichier env hors du dépôt.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_DB: tout_en_un
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?secret_required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tout_en_un']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  web:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [internal]

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env.production
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_healthy }
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
